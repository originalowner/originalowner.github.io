<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    /* === Global Styles === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f6f9;
      color: #333;
    }

    /* === Header === */
    header {
      background-color: #2c3e50;
      color: #ecf0f1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      position: relative;
    }

    header h1 {
      font-size: 22px;
    }

    /* === Profile Dropdown === */
    .user-profile {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .user-profile img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid #1abc9c;
    }

    .user-name {
      font-weight: 500;
    }

    .dropdown {
      position: absolute;
      top: 60px;
      right: 20px;
      background-color: #fff;
      color: #333;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: none;
      flex-direction: column;
      min-width: 160px;
      z-index: 10;
    }

    .dropdown a {
      padding: 10px 15px;
      text-decoration: none;
      color: #333;
      transition: background 0.3s;
    }

    .dropdown a:hover {
      background-color: #f0f0f0;
    }

    /* === Horizontal Menu Bar === */
    .menu-bar {
      background-color: #34495e;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 10px 0;
    }

    .menu-bar a {
      color: #ecf0f1;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      transition: background 0.3s;
      font-weight: 500;
    }

    .menu-bar a:hover {
      background-color: #1abc9c;
    }

    /* === Card Layout === */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      overflow: hidden;
      max-width: 1200px;
      margin: 20px auto;
      padding: 1rem 1.25rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      background-color: #f1f5f9;
    }

    .card-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #0f172a;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-danger {
      background-color: #dc2626;
      color: white;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .text-muted {
      color: #64748b;
    }

    footer {
      background-color: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .menu-bar { flex-wrap: wrap; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- === Header === -->
  <header>
    <h1>My Dashboard</h1>
    <div class="user-profile" id="userProfile">
      <img src="https://i.pravatar.cc/100" alt="User Avatar" />
      <span class="user-name" id="userName">User ▾</span>
      <div class="dropdown" id="dropdownMenu">
        <a href="#">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
  </header>

  <!-- === Menu === -->
  <nav class="menu-bar">
    <a href="#">Overview</a>
    <a href="#" class="active">Projects</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </nav>

  <!-- === Projects Section === -->
  <main>
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Your Projects</h3>
        <button class="btn btn-primary" onclick="createProject()">+ Create Project</button>
      </div>

      <table class="table" id="projectsTable">
        <tbody>
          <tr><td>Loading projects...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- === Footer === -->
  <footer>
    &copy; 2025 My Dashboard | All rights reserved.
  </footer>

  <script>
  const API_BASE = "https://mprb5a7ypl.execute-api.ap-south-1.amazonaws.com"; // replace with your API base
  const token = localStorage.getItem("token");
  const username = localStorage.getItem("username");
  const userNameEl = document.getElementById("userName");
  userNameEl.textContent = (username || "Guest") + " ▾";

  const dropdown = document.getElementById("dropdownMenu");
  const profile = document.getElementById("userProfile");
  const logoutBtn = document.getElementById("logoutBtn");

  profile.addEventListener("click", () => {
    dropdown.style.display = dropdown.style.display === "flex" ? "none" : "flex";
  });

  document.addEventListener("click", (e) => {
    if (!profile.contains(e.target)) dropdown.style.display = "none";
  });

  logoutBtn.addEventListener("click", (e) => {
    e.preventDefault();
    if (confirm("Log out?")) {
      localStorage.clear();
      window.location.href = "/login";
    }
  });

  async function loadProjects() {
    const table = document.getElementById("projectsTable");
    table.innerHTML = "<tr><td>Loading...</td></tr>";

    try {
      const res = await fetch(`${API_BASE}/projects`, {
        headers: { "Authorization": token, "Content-Type": "application/json" }
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || "Failed to fetch");

      if (data.projects.length === 0) {
        table.innerHTML = "<tr><td>No projects yet. Create one!</td></tr>";
        return;
      }

      table.innerHTML = "";
      data.projects.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <div>
              <strong>${p.name}</strong><br>
              <span class="text-muted">${p.projectId}</span><br>
              <small>${new Date(p.createdAt).toLocaleString()}</small>
            </div>
          </td>
          <td style="text-align:right;">
            <button class="btn btn-danger" onclick="deleteProject('${p.projectId}')">Delete</button>
            <a href="project.html?projectId=${p.projectId}" class="btn btn-primary">Open</a>
          </td>`;
        table.appendChild(tr);
      });

    } catch (err) {
      table.innerHTML = `<tr><td style="color:red;">Error: ${err.message}</td></tr>`;
    }
  }

  async function createProject() {
    const name = prompt("Enter new project name:");
    if (!name) return;
    const res = await fetch(`${API_BASE}/projects`, {
      method: "POST",
      headers: {
        "Authorization": token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (res.ok) {
      alert("Project created!");
      loadProjects();
    } else {
      alert(data.error || "Failed to create project");
    }
  }

  async function deleteProject(projectId) {
    if (!confirm(`Delete project ${projectId}?`)) return;
    const res = await fetch(`${API_BASE}/projects?projectId=${projectId}`, {
      method: "DELETE",
      headers: { "Authorization": token }
    });
    const data = await res.json();
    if (res.ok) {
      alert("Deleted!");
      loadProjects();
    } else {
      alert(data.error || "Failed to delete");
    }
  }

  // Initial load
  loadProjects();
  </script>
</body>
</html>
