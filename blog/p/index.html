<!DOCTYPE html>
<html>
<head>
  <title>AWS Cognito Auth Example</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input { padding: 8px; margin: 5px; width: 250px; }
    button { padding: 8px 16px; }
    .box { border: 1px solid #ccc; padding: 20px; width: 300px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <h2>Register</h2>
  <div class="box">
    <input id="reg_email" type="email" placeholder="Email"><br>
    <input id="reg_pass" type="password" placeholder="Password"><br>
    <button onclick="register()">Sign Up</button>
    <p id="reg_msg"></p>
  </div>

  <h2>Login</h2>
  <div class="box">
    <input id="log_email" type="email" placeholder="Email"><br>
    <input id="log_pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="log_msg"></p>
  </div>

  <h2>Call Protected API</h2>
  <div class="box">
    <button onclick="callApi()">Call Backend</button>
    <pre id="api_result"></pre>
  </div>

<script>
// ======== CONFIG (IMPORTANT) ==========
const region = "ap-south-1";                 // e.g. us-east-1
const userPoolId = "ap-south-1_nj9AafOaw";           // e.g. us-east-1_abcd1234
const clientId   = "553l9trb5mm1dodhp15hp0c93f";    // from Cognito App Client
const apiUrl     = "https://dackap1607.execute-api.ap-south-1.amazonaws.com/p";        // e.g. https://xxxx.execute-api.us-east-1.amazonaws.com/prod/hello

// ======== USER SIGN-UP ==========
async function register() {
  const email = document.getElementById("reg_email").value;
  const password = document.getElementById("reg_pass").value;

  const response = await fetch(`https://cognito-idp.${region}.amazonaws.com/`, {
    method: "POST",
    headers: {
      "X-Amz-Target": "AWSCognitoIdentityProviderService.SignUp",
      "Content-Type": "application/x-amz-json-1.1"
    },
    body: JSON.stringify({
      ClientId: clientId,
      Username: email,
      Password: password,
      UserAttributes: [
        { Name: "email", Value: email }
      ]
    })
  });

  const data = await response.json();
  document.getElementById("reg_msg").innerText = JSON.stringify(data, null, 2);
}

// ======== USER LOGIN ==========
async function login() {
  const email = document.getElementById("log_email").value;
  const password = document.getElementById("log_pass").value;

  const response = await fetch(`https://cognito-idp.${region}.amazonaws.com/`, {
    method: "POST",
    headers: {
      "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
      "Content-Type": "application/x-amz-json-1.1"
    },
    body: JSON.stringify({
      AuthFlow: "USER_PASSWORD_AUTH",
      ClientId: clientId,
      AuthParameters: {
        USERNAME: email,
        PASSWORD: password
      }
    })
  });

  const data = await response.json();
  document.getElementById("log_msg").innerText = JSON.stringify(data, null, 2);

  if (data.AuthenticationResult) {
    localStorage.setItem("id_token", data.AuthenticationResult.IdToken);
    localStorage.setItem("access_token", data.AuthenticationResult.AccessToken);
    alert("Login successful!");
  }
}

// ======== CALL PROTECTED API ==========
async function callApi() {
  const token = localStorage.getItem("id_token");
  if (!token) {
    document.getElementById("api_result").innerText = "You must login first.";
    return;
  }

  const response = await fetch(apiUrl, {
    method: "GET",
    headers: {
      Authorization: token
    }
  });

  document.getElementById("api_result").innerText = await response.text();
}
</script>

</body>
</html>
